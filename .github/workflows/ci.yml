name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_PASSWORD_MIGRADOR: migrador_ci
      DB_PASSWORD_API: api_ci
      DB_PASSWORD_PLATAFORMA: plataforma_ci
      # Valores solo para CI (no son secretos de producción).
      PIN_PEPPER: Y2ktcGluLXBlcHBlci1zb2xvLXBhcmEtcHJ1ZWJhcyEh
      ORIGENES_PERMITIDOS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # toma la versión de "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Peso del paquete inicial de la PWA (apps/app): carga rápida con datos móviles.
      - run: pnpm --filter @restaurante/app presupuesto
      - run: pnpm test
        env:
          NODE_ENV: test # obligatoria (criterio 29b); las contraseñas de los roles las da el job
