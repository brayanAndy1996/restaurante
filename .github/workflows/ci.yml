name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # La suite combinada (app, API con PostgreSQL, web y ui) tarda ~20 min en 4 vCPU: 15 min no alcanzaban.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_PASSWORD_MIGRADOR: migrador_ci
      DB_PASSWORD_API: api_ci
      DB_PASSWORD_PLATAFORMA: plataforma_ci
      DB_PASSWORD_TIEMPO_REAL: tiempo_real_ci
      # Valores solo para CI (no son secretos de producción).
      PIN_PEPPER: Y2ktcGluLXBlcHBlci1zb2xvLXBhcmEtcHJ1ZWJhcyEh
      ORIGENES_PERMITIDOS: http://localhost:5173
      # Carta web (historia 005): las pruebas fijan la URL y la cabecera de la IP del cliente por su cuenta.
      CARTA_WEB_URL: http://localhost:3001
      CABECERA_IP_CLIENTE: cf-connecting-ip
      # Las fotos de la carta (historia 003) se guardan en memoria en las pruebas.
      ARCHIVOS_DRIVER: memoria

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # toma la versión de "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Peso del paquete inicial de la PWA (apps/app): carga rápida con datos móviles.
      - run: pnpm --filter @restaurante/app presupuesto
      # Peso del JavaScript y el CSS de la carta web (apps/web), criterio 88 de la historia 005.
      - run: pnpm --filter @restaurante/web presupuesto
      # --continue: si falla una suite, las demás terminan y se ven todas las fallas de una vez (el paso sigue fallando).
      - run: pnpm test --continue
        env:
          NODE_ENV: test # obligatoria (criterio 29b); las contraseñas de los roles las da el job

  # Pruebas E2E de la PWA (Playwright, viewport de celular) contra la API real y PostgreSQL: acceso con
  # equipos recordados e ingreso con PIN (tarea T35 de la sección 002).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: development
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_PASSWORD_MIGRADOR: migrador_ci
      DB_PASSWORD_API: api_ci
      DB_PASSWORD_PLATAFORMA: plataforma_ci
      DB_PASSWORD_TIEMPO_REAL: tiempo_real_ci
      DATABASE_URL: postgres://restaurante_api:api_ci@localhost:5432/restaurante
      DATABASE_PLATAFORMA_URL: postgres://restaurante_plataforma:plataforma_ci@localhost:5432/restaurante
      DATABASE_MIGRADOR_URL: postgres://restaurante_migrador:migrador_ci@localhost:5432/restaurante
      DATABASE_TIEMPO_REAL_URL: postgres://restaurante_tiempo_real:tiempo_real_ci@localhost:5432/restaurante
      # Valores solo para CI (no son secretos de producción).
      PIN_PEPPER: Y2ktcGluLXBlcHBlci1zb2xvLXBhcmEtcHJ1ZWJhcyEh
      # La PWA de la E2E de la carta web corre en el 5174 (el 5173 es el de la E2E de la PWA).
      ORIGENES_PERMITIDOS: http://localhost:5173,http://localhost:5174
      # Carta web (historia 005).
      CARTA_WEB_URL: http://localhost:3001
      # Las fotos de la carta (historia 003) se guardan en disco en desarrollo.
      ARCHIVOS_DRIVER: disco
      ARCHIVOS_DIRECTORIO: ./archivos
      ARCHIVOS_URL_PUBLICA: http://localhost:3000/archivos

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # toma la versión de "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @restaurante/app exec playwright install --with-deps chromium
      - run: pnpm db:preparar
      - run: pnpm db:migrar
      # La prueba usa al superadministrador de la semilla y crea su propia empresa en cada corrida.
      - run: pnpm db:semilla
      - run: pnpm --filter @restaurante/app e2e
      # La carta web (historia 005, 5b): con una API falsa (carta, modo mesa, peso, accesibilidad y compatibilidad) y de
      # punta a punta con la API real, la PWA del Mozo y la carta web (criterio 92).
      - run: pnpm --filter @restaurante/web e2e
      - run: pnpm --filter @restaurante/web e2e
        env:
          E2E_API_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: |
            apps/app/e2e/resultados
            apps/app/playwright-report
            apps/web/e2e/resultados
            apps/web/playwright-report
          retention-days: 7
