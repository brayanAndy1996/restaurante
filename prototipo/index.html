      --color-peligro-oscuro: #ffd0cb;
      --color-sobre-peligro: #0e1923;

  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --color-escenario: #070e14;

    --color-fondo: #0e1923;

    --color-inactivo: #1d2e3b;
    --color-tinta: #e8eef3;
    --color-tinta-suave: #a9b8c4;
    --color-tinta-tenue: #8da0ae;
    --color-accion: #8fb1f2;
    --color-accion-hundida: #6f98e8;
    --color-accion-suave: #1d3358;
    --color-accion-borde: #35538a;
    --color-accion-oscuro: #cfe0fb;

    --color-exito-borde: #2c6a4d;

    --color-aviso-texto: #f5d28c;

    --color-peligro-suave: #3d1a1a;
    --color-peligro-borde: #7d3a36;
    --color-peligro-oscuro: #ffd0cb;
    --color-sobre-peligro: #0e1923;
    --color-plataforma: #070e14;
    --color-sobre-plataforma: #ffffff;
    --color-sobre-plataforma-suave: #c5d0d8;
    --color-velo-plataforma: rgba(255, 255, 255, 0.16);
    --color-cortina: rgba(0, 0, 0, 0.6);

  /* ---------- Base ---------- */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    font-family: var(--fuente);
    font-size: 1rem;
    line-height: 1.5rem;
    color: var(--color-tinta);
    background: var(--color-escenario);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  h1,
  h2,
  h3,
  h4,
  p,
  ol,
  ul,
  dl,
  dd {
    margin: 0;
  }
  ol,
  ul {
    padding: 0;
    list-style: none;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  a {
    color: var(--color-accion);
    text-underline-offset: 3px;
  }
  :focus-visible {
    outline: 3px solid var(--color-accion);
    outline-offset: 2px;
  }
  ::selection {
    background: var(--color-accion);
    color: var(--color-sobre-accion);
  }
  ::placeholder {
    color: var(--color-tinta-tenue);
    opacity: 1;
  }
  * {
    scrollbar-color: var(--color-borde-control) transparent;
  }
  .ui-solo-lectores {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  .ui-icono {
    flex: none;
  }
  [hidden] {
    display: none !important;
  }

  /* ---------- Franja del prototipo y escenario ---------- */
  .franja {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: var(--espacio-md);
    min-height: 44px;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0
      max(16px, env(safe-area-inset-left, 0px));
    background: var(--color-baldosa);
    border-bottom: 1px solid var(--color-junta);
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .franja__texto {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: var(--espacio-sm);
  }
  .franja__texto b {
    color: var(--color-tinta);
    font-weight: 700;
  }
  .franja__ruta {
    display: none;
  }
  @media (min-width: 720px) {
    .franja__ruta {
      display: inline;
    }
  }
  .franja .ui-boton {
    min-height: 44px;
    padding: 0 var(--espacio-md);
    font-size: 0.9375rem;
  }
  .escenario {
    display: grid;
    place-items: center;
    min-height: calc(100dvh - 44px);
    padding: var(--espacio-lg) max(16px, env(safe-area-inset-right, 0px)) var(--espacio-lg)
      max(16px, env(safe-area-inset-left, 0px));
  }
  .marco {
    width: 390px;
    max-width: 100%;
    height: min(844px, calc(100dvh - 44px - 32px));
    min-height: 560px;
    border: 10px solid var(--color-marco);
    border-radius: 40px;
    overflow: hidden;
    background: var(--color-fondo);
  }
  .marco--ancho {
    width: min(100%, 1320px);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-pared);
  }
  @media (max-width: 520px) {
    .escenario {
      display: block;
      padding: 0;
      min-height: 0;
    }
    .marco,
    .marco--ancho {
      width: 100%;
      height: calc(100dvh - 44px);
      min-height: 480px;
      border: 0;
      border-radius: 0;
    }
  }
  body.con-panel .escenario {
    margin-right: 0;
  }
  @media (min-width: 1000px) {
    body.con-panel .escenario,
    body.con-panel .portada {
      margin-right: 360px;
    }
  }

  /* ---------- Aplicación (celular o escritorio) ---------- */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background: var(--color-fondo);
    container: app / inline-size;
  }
  .app__cuerpo {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: 'barra' 'main' 'nav';
  }
  .app__barra {
    grid-area: barra;
  }
  .app__main {
    grid-area: main;
    overflow-y: auto;
    overscroll-behavior: contain;
    min-width: 0;
  }
  .app__nav {
    grid-area: nav;
  }
  @container app (min-width: 720px) {
    .app__cuerpo {
      grid-template-columns: var(--ancho-riel) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: 'nav barra' 'nav main';
    }
    .app__cuerpo--sin-nav {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: 'barra' 'main';
    }
  }
  .app__cuerpo--sin-nav {
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: 'barra' 'main';
  }

  .pagina {
    display: flex;
    flex-direction: column;
    gap: var(--espacio-lg);
    width: 100%;
    max-width: 720px;
    min-height: 100%;
    margin: 0 auto;
    padding: var(--espacio-xl) max(16px, env(safe-area-inset-right, 0px)) var(--espacio-xl)
      max(16px, env(safe-area-inset-left, 0px));
  }
  .pagina--ancha {
    max-width: 1120px;
  }
  .pagina > form {
    flex: 1;
  }
  @container app (min-width: 720px) {
    .pagina {
      padding-top: var(--espacio-xxl);
      padding-bottom: var(--espacio-xxl);
    }
  }
  .pagina__cabecera {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--espacio-md);
  }
  .pagina__cabecera > div {
    flex: 1 1 14rem;
    min-width: 0;
  }
  .pagina__cabecera > .pagina__acciones {
    flex: none;
    flex-wrap: wrap;
    gap: var(--espacio-sm);
    margin-left: auto;
  }
  .ui-titulo {
    font-size: 1.5rem;
    line-height: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .ui-titulo:focus {
    outline: none;
  }
  .ui-subtitulo {
    color: var(--color-tinta-suave);
  }
  .ui-titulo + .ui-subtitulo {
    margin-top: var(--espacio-xs);
  }
  .seccion {
    display: flex;
    flex-direction: column;
    gap: var(--espacio-sm);
  }
  .seccion__titulo {
    font-size: 1.125rem;
    line-height: 1.5rem;
    font-weight: 700;
  }
  .seccion__ayuda {
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .apilado {
    display: flex;
    flex-direction: column;
    gap: var(--espacio-md);
  }
  .apilado--chico {
    gap: var(--espacio-sm);
  }
  .fila-h {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--espacio-sm);
  }
  .columnas {
    display: grid;
    gap: var(--espacio-lg);
    grid-template-columns: minmax(0, 1fr);
  }
  @container app (min-width: 860px) {
    .columnas--2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  .separada {
    margin-top: var(--espacio-sm);
    padding-top: var(--espacio-xl);
    border-top: 1px solid var(--color-junta);
  }
  .acciones-fijas {
    position: sticky;
    bottom: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: var(--espacio-sm);
    margin-top: auto;
    padding-top: var(--espacio-md);
    padding-bottom: var(--espacio-md);
    background: var(--color-fondo);
    border-top: 1px solid var(--color-junta);
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @container app (min-width: 720px) {
    .acciones-fijas {
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      border-top: 0;
      padding: 0;
      margin: var(--espacio-sm) 0 0;
      background: transparent;
    }
    .acciones-fijas > .ui-boton--bloque {
      width: auto;
      min-width: 12rem;
    }
  }

  /* ---------- Marca ---------- */
  .marca {
    display: inline-flex;
    align-items: center;
    gap: var(--espacio-sm);
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: -0.01em;
  }
  .marca__baldosas {
    display: grid;
    grid-template-columns: repeat(2, 10px);
    gap: 2px;
  }
  .marca__baldosas i {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--color-accion);
  }
  .marca__baldosas i:nth-child(2) {
    background: var(--color-accion-borde);
  }
  .marca__baldosas i:nth-child(3) {
    background: var(--color-accion-borde);
  }

  /* ---------- Botones ---------- */
  .ui-boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--espacio-sm);
    min-height: var(--alto-control);
    padding: 0 var(--espacio-lg);
    border-radius: var(--radio-baldosa);
    border: 1px solid var(--color-borde-control);
    background: var(--color-baldosa);
    color: var(--color-tinta);
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.5rem;
    text-decoration: none;
    transition:
      background-color var(--duracion-corta) var(--ease),
      transform var(--duracion-corta) var(--ease);
  }
  .ui-boton:active:not([disabled], [aria-disabled='true']) {
    transform: translateY(1px);
    background: var(--color-accion-suave);
  }
  .ui-boton--principal {
    min-height: var(--alto-principal);
    background: var(--color-accion);
    border-color: var(--color-accion);
    color: var(--color-sobre-accion);
    font-size: 1.0625rem;
  }
  .ui-boton--principal:active:not([disabled], [aria-disabled='true']) {
    background: var(--color-accion-hundida);
  }
  .ui-boton--texto {
    border-color: transparent;
    background: transparent;
    color: var(--color-accion);
    padding: 0 var(--espacio-sm);
  }
  .ui-boton--peligro {
    border-color: var(--color-peligro);
    color: var(--color-peligro);
  }
  .ui-boton--peligro-lleno {
    background: var(--color-peligro);
    border-color: var(--color-peligro);
    color: var(--color-sobre-peligro);
  }
  .ui-boton--peligro-lleno:active:not([disabled], [aria-disabled='true']) {
    background: var(--color-peligro-oscuro);
    color: var(--color-baldosa);
  }
  .ui-boton--sobre-oscuro {
    min-height: 44px;
    padding: 0 var(--espacio-md);
    background: transparent;
    border-color: var(--color-sobre-plataforma);
    color: var(--color-sobre-plataforma);
    font-size: 0.875rem;
  }
  .ui-boton--sobre-oscuro:active:not([disabled], [aria-disabled='true']) {
    background: var(--color-velo-plataforma);
  }
  .ui-boton--bloque {
    width: 100%;
  }
  .ui-boton--chico {
    min-height: 44px;
    padding: 0 var(--espacio-md);
    font-size: 0.9375rem;
  }
  .ui-boton[disabled],
  .ui-boton[aria-disabled='true'] {
    background: var(--color-inactivo);
    border-color: var(--color-junta);
    color: var(--color-tinta-tenue);
    cursor: not-allowed;
  }
  .ui-boton--texto[disabled] {
    background: transparent;
    border-color: transparent;
  }
  .ui-boton[aria-busy='true'] {
    cursor: progress;
  }
  .ui-girando {
    animation: ui-girar 0.9s linear infinite;
  }
  @keyframes ui-girar {
    to {
      transform: rotate(360deg);
    }
  }
  .ui-boton-icono {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: var(--alto-control);
    height: var(--alto-control);
    padding: 0;
    border: 0;
    border-radius: var(--radio-baldosa);
    background: transparent;
    color: var(--color-tinta-suave);
  }
  .ui-boton-icono:active {
    background: var(--color-accion-suave);
  }

  /* ---------- Campos ---------- */
  .ui-campo {
    display: flex;
    flex-direction: column;
    gap: var(--espacio-xs);
    min-width: 0;
  }
  .ui-campo__etiqueta {
    font-weight: 600;
    font-size: 0.9375rem;
    line-height: 1.25rem;
  }
  .ui-campo__opcional {
    font-weight: 400;
    color: var(--color-tinta-suave);
  }
  .ui-campo__entrada {
    display: flex;
    align-items: center;
    min-height: var(--alto-campo);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-baldosa);
    background: var(--color-baldosa);
  }
  .ui-campo__entrada:focus-within {
    outline: 3px solid var(--color-accion);
    outline-offset: 2px;
    border-color: var(--color-accion);
  }
  .ui-campo__control {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: var(--espacio-md);
    outline: 0;
    font-size: 1.0625rem;
    line-height: 1.5rem;
    resize: none;
  }
  select.ui-campo__control {
    appearance: none;
    padding-right: 0;
    min-height: 48px;
  }
  .ui-campo__entrada--seleccion > .ui-icono {
    margin-right: var(--espacio-md);
    color: var(--color-tinta-suave);
    pointer-events: none;
  }
  .ui-campo__prefijo {
    padding-left: var(--espacio-md);
    color: var(--color-tinta-suave);
    font-weight: 600;
  }
  .ui-campo__prefijo + .ui-campo__control {
    padding-left: var(--espacio-sm);
  }
  .ui-campo__ayuda {
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .ui-campo--error .ui-campo__entrada {
    border-color: var(--color-peligro);
    border-width: 2px;
  }
  .ui-campo__mensaje {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    color: var(--color-peligro);
    font-weight: 600;
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .ui-campo__mensaje .ui-icono {
    margin-top: 2px;
  }
  .ui-interruptor {
    display: flex;
    align-items: center;
    gap: var(--espacio-md);
    min-height: var(--alto-control);
    font-weight: 600;
  }
  .ui-interruptor__texto {
    flex: 1;
    min-width: 0;
  }
  .ui-interruptor__texto small {
    display: block;
    font-weight: 400;
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .ui-interruptor__pista {
    display: grid;
    place-items: center;
    flex: none;
    width: 56px;
    height: var(--alto-control);
    padding: 0;
    border: 0;
    background: transparent;
  }
  .ui-interruptor__riel {
    position: relative;
    display: block;
    width: 52px;
    height: 32px;
    border: 2px solid var(--color-borde-control);
    border-radius: 16px;
    background: var(--color-baldosa);
    transition: background-color var(--duracion-corta) var(--ease);
  }
  .ui-interruptor__riel::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--color-borde-control);
    transition:
      transform var(--duracion-corta) var(--ease),
      background-color var(--duracion-corta) var(--ease);
  }
  .ui-interruptor__pista[aria-checked='true'] .ui-interruptor__riel {
    background: var(--color-accion);
    border-color: var(--color-accion);
  }
  .ui-interruptor__pista[aria-checked='true'] .ui-interruptor__riel::after {
    transform: translateX(20px);
    background: var(--color-sobre-accion);
  }

  /* ---------- Segmentos ---------- */
  .ui-segmentos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
    gap: var(--espacio-sm);
  }
  .ui-segmentos--juntos {
    grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
  }
  .ui-segmento {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--espacio-xs);
    min-height: var(--alto-control);
    padding: 0 var(--espacio-md);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-baldosa);
    background: var(--color-baldosa);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.5rem;
    transition: background-color var(--duracion-corta) var(--ease);
  }
  .ui-segmento:active {
    background: var(--color-accion-suave);
  }
  .ui-segmento--elegido {
    background: var(--color-accion-suave);
    border-color: var(--color-accion);
    color: var(--color-accion-oscuro);
    font-weight: 700;
  }

  /* ---------- Avisos, etiquetas ---------- */
  .ui-aviso {
    display: flex;
    gap: var(--espacio-md);
    padding: var(--espacio-md);
    border: 1px solid;
    border-radius: var(--radio-baldosa);
    font-size: 0.9375rem;
    line-height: 1.375rem;
  }
  .ui-aviso__titulo {
    display: block;
    font-weight: 700;
  }
  .ui-aviso__cuerpo {
    min-width: 0;
    flex: 1;
  }
  .ui-aviso__texto {
    display: block;
  }
  .ui-aviso__cuerpo > .ui-boton {
    margin-top: var(--espacio-sm);
  }
  .ui-aviso--error {
    background: var(--color-peligro-suave);
    border-color: var(--color-peligro-borde);
    color: var(--color-peligro-oscuro);
  }
  .ui-aviso--error > .ui-icono {
    color: var(--color-peligro);
  }
  .ui-aviso--ok {
    background: var(--color-exito-suave);
    border-color: var(--color-exito-borde);
    color: var(--color-exito-oscuro);
  }
  .ui-aviso--ok > .ui-icono {
    color: var(--color-exito);
  }
  .ui-aviso--alerta {
    background: var(--color-aviso-suave);
    border-color: var(--color-aviso-borde);
    color: var(--color-aviso-texto);
  }
  .ui-aviso--info {
    background: var(--color-accion-suave);
    border-color: var(--color-accion-borde);
    color: var(--color-accion-oscuro);
  }
  .ui-etiqueta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 24px;
    padding: 0 var(--espacio-sm);
    border-radius: var(--radio-etiqueta);
    font-size: 0.8125rem;
    line-height: 1.125rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .ui-etiqueta .ui-icono {
    width: 14px;
    height: 14px;
  }
  .ui-etiqueta--ok {
    background: var(--color-exito-suave);
    color: var(--color-exito);
  }
  .ui-etiqueta--alerta {
    background: var(--color-aviso-suave);
    color: var(--color-aviso-texto);
  }
  .ui-etiqueta--mal {
    background: var(--color-peligro-suave);
    color: var(--color-peligro);
  }
  .ui-etiqueta--neutro {
    background: var(--color-inactivo);
    color: var(--color-tinta-suave);
  }
  .ui-etiqueta--info {
    background: var(--color-accion-suave);
    color: var(--color-accion);
  }

  /* ---------- Cenefa y banner de estado ---------- */
  .ui-cenefa {
    position: relative;
    height: 8px;
    flex: none;
  }
  .ui-cenefa {
    --ui-cenefa-color: var(--color-accion);
  }
  .ui-cenefa,
  .ui-cenefa__llenado {
    background: repeating-linear-gradient(
      90deg,
      var(--ui-cenefa-color) 0 14px,
      transparent 14px 16px
    );
  }
  .ui-cenefa--aji {
    --ui-cenefa-color: var(--color-aviso);
  }
  .ui-cenefa--rocoto {
    --ui-cenefa-color: var(--color-peligro);
  }
  .ui-cenefa--soporte {
    --ui-cenefa-color: var(--color-aviso);
    background-color: var(--color-plataforma);
  }
  .ui-cenefa--plataforma {
    background: var(--color-plataforma);
  }
  .ui-cenefa__llenado {
    position: absolute;
    inset: 0;
    animation: ui-llenar 240ms steps(24, end) both;
  }
  .ui-cenefa--soporte .ui-cenefa__llenado {
    background-color: var(--color-plataforma);
  }
  @keyframes ui-llenar {
    from {
      clip-path: inset(0 100% 0 0);
    }
    to {
      clip-path: inset(0 0 0 0);
    }
  }
  .ui-banner {
    display: flex;
    gap: var(--espacio-md);
    align-items: flex-start;
    padding: var(--espacio-md) var(--espacio-lg);
    font-size: 0.9375rem;
    line-height: 1.375rem;
  }
  .ui-banner__texto {
    flex: 1;
    min-width: 0;
  }
  .ui-banner__titulo {
    display: block;
    font-weight: 700;
  }
  .ui-banner__detalle {
    display: block;
    font-weight: 400;
  }
  .ui-banner--aji {
    background: var(--color-aviso);
    color: var(--color-sobre-aviso);
  }
  .ui-banner--rocoto {
    background: var(--color-peligro);
    color: var(--color-sobre-peligro);
  }
  .ui-banner--soporte {
    align-items: center;
    padding-block: var(--espacio-sm);
    background: var(--color-plataforma);
    color: var(--color-sobre-plataforma);
  }
  .ui-banner__accion {
    margin-left: auto;
    flex: none;
  }
  @container app (max-width: 479px) {
    .ui-banner--aji,
    .ui-banner--rocoto {
      flex-wrap: wrap;
    }
  }

  /* ---------- Teclado numérico y puntos ---------- */
  .ui-puntos {
    display: flex;
    gap: var(--espacio-lg);
    justify-content: center;
    padding: var(--espacio-sm) 0;
  }
  .ui-puntos__punto {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--color-borde-control);
    background: transparent;
  }
  .ui-puntos__punto--lleno {
    background: var(--color-tinta);
    border-color: var(--color-tinta);
  }
  .ui-puntos--error .ui-puntos__punto {
    border-color: var(--color-peligro);
  }
  .ui-puntos--error .ui-puntos__punto--lleno {
    background: var(--color-peligro);
  }
  .ui-puntos--apagado .ui-puntos__punto {
    border-color: var(--color-junta);
  }
  .ui-teclado {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: var(--color-junta-teclado);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-pared);
    overflow: hidden;
  }
  .ui-tecla {
    display: grid;
    place-items: center;
    min-height: var(--alto-tecla);
    border: 0;
    border-radius: 0;
    background: var(--color-baldosa);
    font-size: 1.75rem;
    line-height: 2rem;
    font-weight: 600;
    transition: background-color 100ms var(--ease);
  }
  .ui-tecla:active:not([disabled]) {
    background: var(--color-accion-suave);
    color: var(--color-accion);
  }
  .ui-tecla--funcion {
    background: var(--color-fondo);
    color: var(--color-tinta-suave);
  }
  .ui-tecla--vacia {
    background: var(--color-fondo);
  }
  .ui-tecla[disabled] {
    background: var(--color-inactivo);
    color: var(--color-tinta-tenue);
    cursor: not-allowed;
  }
  .ui-tecla:focus-visible {
    outline-offset: -4px;
  }
  .ui-teclado--compacto .ui-tecla {
    min-height: 52px;
    font-size: 1.5rem;
    line-height: 1.75rem;
  }
  .teclado-zona {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
  }
  .cuenta-grande {
    display: block;
    font-size: 2.5rem;
    line-height: 2.75rem;
    font-weight: 700;
    text-align: center;
  }

  /* ---------- Persona y cupos ---------- */
  .ui-persona {
    display: flex;
    align-items: center;
    gap: var(--espacio-md);
    width: 100%;
    min-height: var(--alto-baldosa-persona);
    padding: var(--espacio-md);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-baldosa);
    background: var(--color-baldosa);
    text-align: left;
    transition: background-color var(--duracion-corta) var(--ease);
  }
  .ui-persona:active:not([disabled]) {
    background: var(--color-accion-suave);
  }
  .ui-inicial {
    display: grid;
    place-items: center;
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: var(--radio-baldosa);
    background: var(--color-accion-suave);
    color: var(--color-accion);
    font-weight: 700;
    font-size: 1.25rem;
  }
  .ui-inicial--chica {
    width: 40px;
    height: 40px;
    font-size: 1.0625rem;
  }
  .ui-persona__texto {
    flex: 1;
    min-width: 0;
  }
  .ui-persona__nombre {
    display: block;
    font-weight: 700;
    font-size: 1.125rem;
    line-height: 1.5rem;
    overflow-wrap: anywhere;
  }
  .ui-persona__detalle {
    display: block;
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .ui-persona--bloqueada {
    background: var(--color-inactivo);
    border-color: var(--color-junta);
  }
  .ui-persona--bloqueada .ui-inicial {
    background: var(--color-junta);
    color: var(--color-tinta-tenue);
  }
  .ui-persona--bloqueada .ui-persona__detalle {
    color: var(--color-peligro);
    font-weight: 600;
  }
  .ui-cupos {
    display: flex;
    align-items: center;
    gap: var(--espacio-md);
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .ui-cupos__baldosas {
    display: flex;
    gap: var(--espacio-xs);
  }
  .ui-cupos__baldosa {
    width: 16px;
    height: 16px;
    border-radius: var(--radio-etiqueta);
    border: 1.5px solid var(--color-borde-control);
  }
  .ui-cupos__baldosa--llena {
    background: var(--color-accion);
    border-color: var(--color-accion);
  }

  /* ---------- Hoja y diálogo (dentro del celular) ---------- */
  .hoja-cortina {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--color-cortina);
  }
  .hoja {
    position: absolute;
    z-index: 21;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    max-height: 92%;
    border-radius: var(--radio-hoja) var(--radio-hoja) 0 0;
    background: var(--color-baldosa);
    color: var(--color-tinta);
    box-shadow: var(--sombra-hoja);
    overflow: hidden;
  }
  .hoja--nueva {
    animation: ui-subir var(--duracion-hoja) var(--ease) both;
  }
  @keyframes ui-subir {
    from {
      transform: translateY(24px);
      opacity: 0;
    }
    to {
      transform: none;
      opacity: 1;
    }
  }
  @keyframes ui-aparecer {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  .hoja__asa {
    flex: none;
    width: 40px;
    height: 4px;
    margin: var(--espacio-md) auto 0;
    border-radius: var(--radio-etiqueta);
    background: var(--color-junta);
  }
  .hoja__cabecera {
    display: flex;
    align-items: center;
    gap: var(--espacio-sm);
    padding: var(--espacio-sm) var(--espacio-sm) 0 var(--espacio-lg);
  }
  .hoja__titulo {
    flex: 1;
    min-width: 0;
    font-size: 1.25rem;
    line-height: 1.625rem;
    font-weight: 700;
  }
  .hoja__titulo:focus {
    outline: none;
  }
  .hoja__cuerpo {
    display: flex;
    flex-direction: column;
    gap: var(--espacio-md);
    padding: var(--espacio-md) var(--espacio-lg)
      max(var(--espacio-lg), env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  @container app (min-width: 720px) {
    .hoja {
      top: 50%;
      left: 50%;
      right: auto;
      bottom: auto;
      width: min(480px, calc(100% - 32px));
      max-height: calc(100% - 48px);
      transform: translate(-50%, -50%);
      border-radius: var(--radio-hoja);
    }
    .hoja--nueva {
      animation: ui-aparecer var(--duracion-hoja) var(--ease) both;
    }
    .hoja__asa {
      display: none;
    }
    .hoja__cabecera {
      padding-top: var(--espacio-md);
    }
  }

  /* ---------- Barra superior y navegación ---------- */
  .ui-barra {
    display: flex;
    align-items: center;
    gap: var(--espacio-sm);
    min-height: var(--alto-barra);
    padding: var(--espacio-xs) max(8px, env(safe-area-inset-right, 0px)) var(--espacio-xs)
      max(16px, env(safe-area-inset-left, 0px));
    background: var(--color-baldosa);
    border-bottom: 1px solid var(--color-junta);
  }
  .ui-barra--plataforma {
    background: var(--color-plataforma);
    color: var(--color-sobre-plataforma);
    border-bottom: 0;
  }
  .ui-barra--plataforma .ui-boton--texto {
    color: var(--color-sobre-plataforma);
  }
  .ui-barra__titulo {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.25rem;
    line-height: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ui-barra__sucursal {
    display: inline-flex;
    align-items: center;
    gap: var(--espacio-sm);
    flex: 0 1 auto;
    min-width: 0;
    max-width: 48%;
    min-height: var(--alto-control);
    padding: 0 var(--espacio-md);
    border: 1px solid var(--color-borde-control);
    border-radius: var(--radio-baldosa);
    background: var(--color-baldosa);
    font-weight: 600;
    font-size: 0.9375rem;
  }
  .ui-barra__sucursal > span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ui-barra__persona {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--espacio-sm);
    min-width: var(--alto-control);
    height: var(--alto-control);
    padding: 0;
    border: 0;
    background: transparent;
    border-radius: var(--radio-baldosa);
    flex: none;
  }
  .ui-barra__persona-texto {
    display: none;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    max-width: 200px;
    padding-right: var(--espacio-xs);
    text-align: left;
    font-size: 0.8125rem;
    line-height: 1.125rem;
    color: var(--color-tinta-suave);
  }
  .ui-barra__persona-texto b {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.9375rem;
    line-height: 1.25rem;
    font-weight: 600;
    color: var(--color-tinta);
  }
  @container app (min-width: 720px) {
    .ui-barra__persona-texto {
      display: flex;
    }
  }
  .ui-barra__quien {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 0;
    font-size: 0.8125rem;
    line-height: 1.125rem;
    color: var(--color-sobre-plataforma-suave);
    text-align: right;
  }
  .ui-barra__quien b {
    font-size: 0.9375rem;
    line-height: 1.25rem;
    font-weight: 600;
    color: var(--color-sobre-plataforma);
  }
  .ui-barra__espacio {
    flex: 1;
  }
  @container app (max-width: 479px) {
    .ui-barra__quien > span {
      display: none;
    }
  }
  .ui-nav {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    background: var(--color-baldosa);
    border-top: 1px solid var(--color-junta);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .ui-nav__destino {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: var(--alto-navegacion);
    padding: 0;
    border: 0;
    background: transparent;
    font-size: 0.8125rem;
    line-height: 1.125rem;
    font-weight: 600;
    color: var(--color-tinta-suave);
    text-decoration: none;
  }
  .ui-nav__destino[aria-current='page'] {
    color: var(--color-accion);
  }
  .ui-nav__destino[aria-current='page']::before {
    content: '';
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 3px;
    background: var(--color-accion);
    border-radius: 0 0 var(--radio-etiqueta) var(--radio-etiqueta);
  }
  .ui-nav--plataforma {
    background: var(--color-plataforma);
    border-color: var(--color-plataforma);
  }
  .ui-nav--plataforma .ui-nav__destino {
    color: var(--color-sobre-plataforma-suave);
  }
  .ui-nav--plataforma .ui-nav__destino[aria-current='page'] {
    color: var(--color-sobre-plataforma);
  }
  .ui-nav--plataforma .ui-nav__destino[aria-current='page']::before {
    background: var(--color-aviso);
  }
  @container app (min-width: 720px) {
    .ui-nav {
      grid-auto-flow: row;
      grid-auto-columns: auto;
      grid-auto-rows: min-content;
      align-content: start;
      width: var(--ancho-riel);
      height: 100%;
      border-top: 0;
      border-right: 1px solid var(--color-junta);
      padding-bottom: 0;
    }
    .ui-nav__destino {
      padding: var(--espacio-sm) 0;
    }
    .ui-nav__destino[aria-current='page']::before {
      top: 20%;
      bottom: 20%;
      left: 0;
      right: auto;
      width: 3px;
      height: auto;
      border-radius: 0 var(--radio-etiqueta) var(--radio-etiqueta) 0;
    }
  }

  /* ---------- Listas y tablas ---------- */
  .ui-lista {
    display: flex;
    flex-direction: column;
    background: var(--color-baldosa);
    border: 1px solid var(--color-junta);
    border-radius: var(--radio-baldosa);
    overflow: hidden;
  }
  .ui-fila {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--espacio-md);
    width: 100%;
    min-height: var(--alto-baldosa-persona);
    padding: var(--espacio-md) var(--espacio-lg);
    border: 0;
    border-bottom: 1px solid var(--color-junta);
    background: var(--color-baldosa);
    color: inherit;
    text-align: left;
    text-decoration: none;
  }
  .ui-lista > :last-child,
  .ui-lista > li:last-child > .ui-fila {
    border-bottom: 0;
  }
  a.ui-fila:active,
  button.ui-fila:active {
    background: var(--color-accion-suave);
  }
  .ui-fila__texto {
    flex: 1;
    min-width: 0;
  }
  .ui-fila__titulo {
    display: block;
    font-weight: 700;
    font-size: 1.0625rem;
    line-height: 1.375rem;
    overflow-wrap: anywhere;
  }
  .ui-fila__ayuda {
    display: block;
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--color-tinta-suave);
  }
  .ui-fila__derecha {
    display: flex;
    align-items: center;
    gap: var(--espacio-sm);
    color: var(--color-tinta-suave);
  }
  .ui-fila__extra {
    display: flex;
    flex-wrap: wrap;
    gap: var(--espacio-xs);
    width: 100%;
  }
  .ui-fila--apagada .ui-fila__titulo {
    color: var(--color-tinta-suave);
  }
  .ui-fila__monto {
    font-weight: 700;
    font-size: 1.0625rem;
    color: var(--color-tinta);
  }
  .ui-fila__monto--tachado {
    text-decoration: line-through;
    color: var(--color-tinta-suave);
    font-weight: 400;
  }
  .solo-tabla {
    display: none;
  }
  @container app (min-width: 720px) {
    .solo-lista {
      display: none;
    }
    .solo-tabla {
      display: block;
    }
  }
  .ui-tabla-envoltorio {
    overflow-x: auto;
    background: var(--color-baldosa);
    border: 1px solid var(--color-junta);
    border-radius: var(--radio-baldosa);
  }
  .ui-tabla {
    width: 100%;
    border-collapse: collapse;
  }
  .ui-tabla th {
    padding: var(--espacio-md);
    text-align: left;
    font-size: 0.8125rem;
    line-height: 1.125rem;
    font-weight: 700;
    color: var(--color-tinta-suave);
    border-bottom: 2px solid var(--color-junta);
    background: var(--color-fondo);
  }
  .ui-tabla td {
    padding: var(--espacio-sm) var(--espacio-md);
    font-size: 0.9375rem;
    line-height: 1.375rem;
    vertical-align: middle;
    border-bottom: 1px solid var(--color-junta);
  }
  .ui-tabla tbody tr:last-child td {
    border-bottom: 0;
  }
  .ui-tabla .ui-tabla__derecha {
    text-align: right;
  }
  .ui-tabla .ui-tabla__sin-saltos {
    white-space: nowrap;
  }
  .ui-tabla tr.ui-tabla__apagada td {
    color: var(--color-tinta-suave);
  }
  .ui-tabla td .celda-nombre {
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: var(--espacio-md);
    font-weight: 700;
  }
  .ui-tabla td .celda-nombre small {
    display: block;
    font-weight: 400;
    font-size: 0.875rem;
    color: var(--color-tinta-suave);
  }
  .ui-tabla td .fila-h {
    flex-wrap: nowrap;
    justify-content: flex-end;
  }
  .ui-tabla td .ui-boton {

    /* ---------- Enrutador y dibujo ---------- */
    function ruta() {
      var h = location.hash.replace(/^#/, '');
      return RUTAS[h] ? h : 'portada';
    }
    function ir(n) {
      if (location.hash === '#' + n) render({ cambio: true });
      else location.hash = n;
    }
    function guardia(d) {
      if (d.sesion === 'trab') {
        if (!S.sesion) return S.personas.length ? 'pin' : 'ingreso';
        if (d.roles && d.roles.indexOf(rolEfectivo()) < 0) return 'inicio';
      }
      if (d.sesion === 'super' && !S.superSesion) return 'super-ingreso';
      return null;
    }
    function selectorDe(el) {
      if (!el || !el.getAttribute) return null;
      var id = el.getAttribute('id');
      if (id && /^[\w-]+$/.test(id)) return '#' + id;
      var a = el.getAttribute('data-a');
      if (!a) return null;
      var s = '[data-a="' + a + '"]';
      ['data-v', 'data-id'].forEach(function (n) {
        var v = el.getAttribute(n);
        if (v !== null && /^[\w.\-]*$/.test(v)) s += '[' + n + '="' + v + '"]';
      });
      return s;
    }
    function armarApp(d, r) {
      var est = cabeceraEstado(d);
      var previa = S.cenefaPrev;
      S.cenefaPrev = est.kind;
      var c = d.render();
      var barra = '';
      if (c.barra === 'trab') barra = barraTrab(c.titulo, c.atras);
      else if (c.barra === 'plat') barra = barraPlat(c.titulo, c.atras);
      else if (c.barra === 'platLogin') barra = barraPlatLogin();
      else if (c.barra === 'ninguna') barra = '';
      else barra = barraSimple(c.titulo, c.atras);
      var nav = '';
      if (c.nav === 'trab') nav = navTrab(c.activo);
      else if (c.nav === 'plat') nav = navPlat(c.activo);
      var cuerpo =
        '<div class="app__cuerpo' +
        (nav ? '' : ' app__cuerpo--sin-nav') +
        (barra ? '' : ' app__cuerpo--sin-barra') +
        (c.nav === 'plat' ? ' app__cuerpo--plat' : '') +
        '">' +
        barra +
        '<main class="app__main" id="principal">' +
        c.main +
        '</main>' +
        nav +
        '</div>';
      return cenefaHtml(est.kind, previa) + est.banner + cuerpo + hojaHtml();
    }
    function render(opts) {
      opts = opts || {};
      var r = ruta();
      var d = RUTAS[r];
      var g = guardia(d);
      if (g) {
        ir(g);
        return;
      }
      if (S.flash && S.flash.para !== r && opts.cambio) S.flash = null;
      var portada = $('#portada');
      var escenario = $('#escenario');
      document.title = 'Prototipo Restaurante';
      if (d.modo === 'portada') {
        escenario.hidden = true;
        portada.hidden = false;
        portada.innerHTML = d.render();
        if (opts.cambio) window.scrollTo(0, 0);
        S.cenefaPrev = null;
      } else {
        portada.hidden = true;
        escenario.hidden = false;
        var ancho = d.modo === 'ancho' && S.vista !== 'celular';
        $('#marco').className = 'marco' + (ancho ? ' marco--ancho' : '');
        var app = $('#app');
        var main = $('.app__main', app);
        var scroll = main && !opts.cambio ? main.scrollTop : 0;
        var foco = selectorDe(document.activeElement);
        var enApp = document.activeElement && app.contains(document.activeElement);
        app.innerHTML = armarApp(d, r);
        S.hoja && (S.hoja.nueva = false);
        var m2 = $('.app__main', app);
        if (m2 && scroll) m2.scrollTop = scroll;
        if (S.hoja) {
          if (opts.hoja || !enApp) {
            var t = $('#hoja-titulo', app);
            var primero = $('.hoja [data-foco]', app);
            (primero || t).focus({ preventScroll: true });
          } else if (foco && $(foco, app)) $(foco, app).focus({ preventScroll: true });
        } else if (opts.cerrando && S.retorno && $(S.retorno, app)) {
          $(S.retorno, app).focus({ preventScroll: true });
        } else if (opts.cambio) {
          var h1 = $('#titulo-pantalla', app) || $('.ui-titulo', app);
          if (h1) {
            h1.setAttribute('tabindex', '-1');
            h1.focus({ preventScroll: true });
          }
        } else if (enApp && foco && $(foco, app)) {
          $(foco, app).focus({ preventScroll: true });
        }
      }
      document.body.classList.toggle('con-panel', !!S.panel);
      pintarPanel();
      tick();
    }
    function conCarga(clave, tiempo, fn) {
      S.ui.cargando = clave;
      render();
      setTimeout(function () {
        if (S.ui.cargando !== clave) return;
        S.ui.cargando = null;
        fn();
      }, tiempo);
    }

          el.setAttribute('data-hecho', '1');
          var a = el.getAttribute('data-alfin');
          if (a && ACC[a]) ACC[a](el);
        }
      });
    }

    function aMin(h) {

    }
    function cruza(t) {
      return aMin(t.hasta) <= aMin(t.desde);

    function intervalo(t) {
      var ini = (t.dia - 1) * 1440 + aMin(t.desde);
      var dur = cruza(t) ? 1440 - aMin(t.desde) + aMin(t.hasta) : aMin(t.hasta) - aMin(t.desde);
      return [ini, ini + dur];

    function etiquetaTramo(t) {

    function erroresHorario(h) {
      var out = { dias: {}, malos: {}, hay: false };
      if (!h) return out;
      for (var i = 0; i < h.length; i++) {
        if (h[i].desde === h[i].hasta) {
          out.dias[h[i].dia] = (out.dias[h[i].dia] || []).concat([
            'El tramo ' +
              h[i].desde +
              ' – ' +
              h[i].hasta +
              ' no tiene duración. Cambia la hora de inicio o la de fin.',
          ]);
          out.malos[i] = true;
          out.hay = true;
        }
      }
      for (var a = 0; a < h.length; a++) {
        for (var b = a + 1; b < h.length; b++) {
          if (h[a].desde === h[a].hasta || h[b].desde === h[b].hasta) continue;
          var x = intervalo(h[a]);
          var y = intervalo(h[b]);
          var solapa = false;
          [0, 10080, -10080].forEach(function (off) {
            if (x[0] < y[1] + off && y[0] + off < x[1]) solapa = true;
          });
          if (solapa) {
            var tardio = h[a].dia > h[b].dia ? a : b;
            var otro = tardio === a ? b : a;
            var d = h[tardio].dia;
            var msg =
              h[tardio].dia === h[otro].dia
                ? 'El tramo ' +
                  etiquetaTramo(h[tardio]) +
                  ' se solapa con ' +
                  etiquetaTramo(h[otro]) +
                  '. Une los tramos o cambia las horas.'
                : 'El tramo ' +
                  etiquetaTramo(h[tardio]) +
                  ' se solapa con ' +
                  etiquetaTramo(h[otro]) +
                  ' del ' +
                  DIAS_LARGOS[h[otro].dia - 1] +
                  ', que sigue después de medianoche.';
            out.dias[d] = (out.dias[d] || []).concat([msg]);

        var j = i;
        while (j + 1 < d.length && d[j + 1] === d[j] + 1) j++;
        partes.push(
          j - i >= 2
            ? DIAS[d[i] - 1] + ' a ' + DIAS[d[j] - 1]
            : d
                .slice(i, j + 1)
                .map(function (x) {

    function editorHorario(ns, vacioTxt) {
      var h = S.form[ns + '.horario'] || [];

      var ed = S.ui.hedit && S.ui.hedit.ns === ns ? S.ui.hedit : null;
      var html = '<div class="ui-horario" role="group" aria-label="Horario por día">';
      for (var dia = 1; dia <= 7; dia++) {
        var tr = [];
        h.forEach(function (t, i) {
          if (t.dia === dia) tr.push({ t: t, i: i });
        });
        tr.sort(function (a, b) {
          return aMin(a.t.desde) - aMin(b.t.desde);
        });
        var msgs = errs.dias[dia] || [];
        html +=
          '<div class="ui-horario__dia' +
          (msgs.length ? ' ui-horario__dia--error' : '') +
          '"><span class="ui-horario__nombre">' +
          DIAS[dia - 1] +
          '</span><div class="ui-horario__tramos">';
        if (!tr.length && !(ed && ed.dia === dia))
          html += '<span class="ui-horario__vacio">' + vacioTxt + '</span>';
        tr.forEach(function (x) {
          html +=
            '<span class="ui-tramo' +
            (errs.malos[x.i] ? ' ui-tramo--error' : '') +
            '"><button type="button" class="ui-tramo__editar" data-a="hEditar" data-v="' +
            ns +
            ':' +
            x.i +
            '" aria-label="Editar tramo ' +
            etiquetaTramo(x.t) +
            ' del ' +
            DIAS_LARGOS[dia - 1] +
            '">' +
            etiquetaTramo(x.t) +
            '</button><button type="button" class="ui-tramo__quitar" data-a="hQuitar" data-v="' +
            ns +
            ':' +
            x.i +
            '" aria-label="Quitar tramo ' +
            etiquetaTramo(x.t) +
            ' del ' +
            DIAS_LARGOS[dia - 1] +
            '">' +
            ico('x', 20) +
            '</button></span>';
        });
        html +=
          '<button type="button" class="ui-horario__mas" data-a="hAgregar" data-v="' +
          ns +
          ':' +
          dia +
          '" aria-label="Agregar tramo el ' +
          DIAS_LARGOS[dia - 1] +
          '">' +
          ico('mas', 20) +
          '</button></div>';
        var cruzan = tr.filter(function (x) {
          return cruza(x.t);
        });
        if (cruzan.length || msgs.length) {
          html += '<div class="ui-horario__errores apilado apilado--chico" style="gap:4px">';
          cruzan.forEach(function (x) {
            html +=
              '<span class="ui-fila__ayuda">El tramo ' +
              etiquetaTramo(x.t) +
              ' sigue el ' +
              DIAS_LARGOS[dia % 7] +
              ' hasta las ' +
              x.t.hasta +
              '.</span>';
          });
          msgs.forEach(function (m) {
            html +=
              '<span class="ui-campo__mensaje" role="alert">' +
              ico('alerta', 16) +
              '<span>' +
              esc(m) +
              '</span></span>';
          });
          html += '</div>';
        }
        if (ed && ed.dia === dia) {
          html +=
            '<div class="ui-horario__edicion" role="group" aria-label="' +
            (ed.idx >= 0 ? 'Editar' : 'Nuevo') +
            ' tramo del ' +
            DIAS_LARGOS[dia - 1] +
            '">' +
            '<div class="ui-campo"><label class="ui-campo__etiqueta" for="c-h-desde">Desde</label><div class="ui-campo__entrada"><input class="ui-campo__control" type="time" id="c-h-desde" data-k="h.desde" value="' +

            '<p class="ui-campo__ayuda" style="width:100%">Si la hora final es menor que la inicial, el tramo sigue después de medianoche (por ejemplo, 18:00 a 02:00).</p>' +
            '<div class="ui-horario__edicion-acciones">' +
            B('Guardar tramo', 'hGuardar', { p: true, domId: 'btn-guardar-tramo' }) +

        emp.sucursales.some(function (x) {

        S.err['suc.codigo'] = 'Otra sucursal de ese emisor ya usa ese código.';
      if (!dir) S.err['suc.direccion'] = 'Escribe la dirección.';
      if (wa && !/^\+519\d{8}$/.test(wa))
        S.err['suc.whatsapp'] = 'Escribe un celular peruano con el formato +51 9XX XXX XXX.';

    ACC.crearEmpresa = function () {
      S.err = {};
      var n = S.form['emp.n'];
      var razon = String(fv('emp.razon')).trim();
      var ruc = String(fv('emp.ruc')).trim();
      if (!razon) S.err['emp.razon'] = 'Escribe la razón social.';
      if (!validarRuc(ruc)) S.err['emp.ruc'] = 'El RUC no es válido. Revisa los 11 dígitos.';
      else if (rucUsado(ruc)) S.err['emp.ruc'] = 'Ese RUC ya está registrado.';
      var venc = String(fv('emp.venc'));
      if (!venc || venc < HOY) S.err['emp.venc'] = 'El vencimiento no puede ser anterior a hoy.';
      var codigos = {};
      for (var i = 0; i < n; i++) {
        if (!String(fv('emp.s' + i + '.nombre')).trim())
          S.err['emp.s' + i + '.nombre'] = 'Escribe el nombre de la sucursal.';
        var c = String(fv('emp.s' + i + '.codigo')).trim();
        if (!/^\d{4}$/.test(c)) S.err['emp.s' + i + '.codigo'] = 'El código tiene 4 dígitos.';
        else if (codigos[c])
          S.err['emp.s' + i + '.codigo'] = 'Ya usaste ese código en otra sucursal.';
        codigos[c] = true;
        if (!String(fv('emp.s' + i + '.dir')).trim())
          S.err['emp.s' + i + '.dir'] = 'Escribe la dirección.';
      }
      if (!String(fv('emp.admNombre')).trim())
        S.err['emp.admNombre'] = 'Escribe el nombre del Administrador.';
      var au = String(fv('emp.admUsuario')).trim().toLowerCase();
      if (!/^[a-z0-9._-]{3,50}$/.test(au))
        S.err['emp.admUsuario'] =
          'Usa de 3 a 50 caracteres: minúsculas, números, punto, guion o guion bajo.';
      else if (usuarioOcupado(au))
        S.err['emp.admUsuario'] = 'Ese nombre de usuario no está disponible.';
      if (String(fv('emp.admPass')).length < 8) S.err['emp.admPass'] = 'Usa al menos 8 caracteres.';
      if (!String(fv('emp.motivo')).trim()) S.err['emp.motivo'] = 'Escribe el motivo.';
      if (Object.keys(S.err).length) {
        render();
        var el = $('.ui-campo--error input, .ui-campo--error select');
        if (el) {
          el.focus();
          el.scrollIntoView({ block: 'center' });
        }
        return;
      }
      var id = 'e' + (S.data.empresas.length + 1);
      var emisorId = 'x' + (10 + S.data.empresas.length);
      var sucs = [];
      for (var j = 0; j < n; j++) {

          id: 's' + (20 + S.data.empresas.length * 5 + j),
          nombre: String(fv('emp.s' + j + '.nombre')).trim(),
          emisorId: emisorId,
          codigo: String(fv('emp.s' + j + '.codigo')).trim(),
          direccion: String(fv('emp.s' + j + '.dir')).trim(),
          whatsapp: '',
          horario: [],
          planId: fv('emp.plan'),
          venc: venc,
          consumo: [0, 0],
          pagos: [],
        });
      }
      S.data.empresas.push({
        id: id,
        nombre: razon,
        comercial: razon.split(' ')[0] + ' ' + (razon.split(' ')[1] || ''),
        ruc: ruc,
        emisores: [{ id: emisorId, ruc: ruc, razon: razon, regimen: 'Por definir' }],

      var pin = nuevoPin(6);

    ACC.crearPlan = function () {
      S.err = {};
      var cod = String(fv('pl.codigo')).trim().toUpperCase();
      var g = String(fv('pl.gracia')).trim();
      if (!/^[A-Z0-9_]{2,20}$/.test(cod))
        S.err['pl.codigo'] = 'Usa de 2 a 20 letras o números, sin espacios.';
      else if (
        S.data.planes.some(function (p) {
          return p.codigo === cod;
        })
      )
        S.err['pl.codigo'] = 'Ya existe un plan con ese código.';
      if (!String(fv('pl.nombre')).trim()) S.err['pl.nombre'] = 'Escribe el nombre del plan.';
      if (!/^\d+$/.test(g) || Number(g) > 60)
        S.err['pl.gracia'] = 'Escribe un número entero entre 0 y 60.';
      if (Object.keys(S.err).length) {
        render();
        var el = $('.ui-campo--error input');
        if (el) el.focus();
        return;
      }
      if (fv('pl.defecto', false))
        S.data.planes.forEach(function (p) {
          p.defecto = false;
        });
      S.data.planes.push({
        id: 'p' + (S.data.planes.length + 1),
        codigo: cod,
        nombre: String(fv('pl.nombre')).trim(),
        gracia: Number(g),
        precio: null,
        cuota: null,
        defecto: !!fv('pl.defecto', false),
        activo: true,
        modulos: MODULOS.filter(function (x, i) {
          return S.form['pl.m' + i];
        }),
      });
      S.ui.formDe = null;
      flash('planes', 'ok', 'Creaste el plan ' + cod, 'Ya puedes asignarlo a una sucursal.');
      ir('planes');
    };

      if (S.panel) {
        var t = $('#panel h2');
        if (t) {
          t.setAttribute('tabindex', '-1');
          t.focus({ preventScroll: true });
        }
      } else $('#btn-panel').focus();
    };
    ACC.rol = function (el) {
      var rol = el.getAttribute('data-v');
      S.hoja = null;
      S.flash = null;
      S.ui = {};
      S.form = {};
      S.err = {};
      S.clave = null;
      if (window.innerWidth < 1000) S.panel = false;
      if (rol === 'super') {
        S.sesion = null;
        S.superSesion = { nombre: persona('ana').nombre };
        S.rolPref = 'super';
        S.escena = null;
        ir('empresas');
        return;
      }
      S.superSesion = null;
      conRoster();
      sesionComo(rol);
      S.escena = null;
      ir('inicio');
    };
    ACC.simular = function (el) {
      var k = el.getAttribute('data-v');
      if (k === 'sinRed') {
        S.sim.sinRed = !S.sim.sinRed;
        if (!S.sim.sinRed && S.cola > 0) {
          var n = S.cola;
          S.cola = 0;
          S.data.caja.pend = false;
          S.data.mesas.forEach(function (m) {
            if (m.cuenta === 'pendiente') m.cuenta = 'enviada';
          });
          S.data.registro.forEach(function (r) {
            r.pend = false;
          });
          S.flash = {
            para: ruta(),
            tipo: 'ok',
            titulo: 'Volvió la conexión',
            texto:
              'Enviamos ' +
              plural(n, 'cambio que estaba pendiente', 'cambios que estaban pendientes') +
              '.',
          };
        }
      }
      if (k === 'fuera') S.sim.fuera = !S.sim.fuera;
      if (k === 'gracia')
        estadoSuc(subDe(S.data.empresas[0].sucursales[0]).e === 'EN_GRACIA' ? 'activa' : 'gracia');
      if (k === 'suspendida')
        estadoSuc(
          subDe(S.data.empresas[0].sucursales[0]).e === 'SUSPENDIDA' ? 'activa' : 'suspendida',
        );
      render();
    };
    ACC.tema = function (el) {
      S.tema = el.getAttribute('data-v');
      aplicarTema();
      guardar('tema', S.tema);
      render();
    };
    function aplicarTema() {
      var r = document.documentElement;
      if (S.tema === 'claro') r.setAttribute('data-theme', 'light');
      else if (S.tema === 'oscuro') r.setAttribute('data-theme', 'dark');
      else r.removeAttribute('data-theme');
    }
    ACC.vista = function (el) {
      S.vista = el.getAttribute('data-v');
      render();
    };
    ACC.pistasAlt = function () {
      S.pistas = !S.pistas;
      guardar('pistas', S.pistas ? '1' : '0');
      render();
    };
    ACC.reiniciar = function () {
      S = estadoNuevo(S);
      S.escena = null;
      ir('portada');
      render({ cambio: true });
    };

    /* ---------- Eventos generales ---------- */
    ACC.hoja = function (el) {
      abrirHoja(el.getAttribute('data-v'));
    };
    ACC.cerrarHoja = function () {
      cerrarHoja();
    };
    ACC.ver = function (el) {
      var k = el.getAttribute('data-v');
      S.ui.ver = S.ui.ver || {};
      S.ui.ver[k] = !S.ui.ver[k];
      render();
    };
    ACC.sw = function (el) {
      var k = el.getAttribute('data-v');
      S.form[k] = !fv(k, false);
      render();
    };
    document.addEventListener('click', function (e) {
      var enlace = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (enlace && enlace.closest('.hoja')) S.hoja = null;
      var el = e.target.closest ? e.target.closest('[data-a]') : null;
      if (!el || el.disabled) return;
      S.ultimoClick = selectorDe(el);
      var f = ACC[el.getAttribute('data-a')];
      if (f) f(el, e);
    });
    document.addEventListener('submit', function (e) {
      e.preventDefault();
      var a = e.target.getAttribute && e.target.getAttribute('data-submit');
      if (a && ACC[a]) ACC[a](e.target, e);
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      var k = t.getAttribute && t.getAttribute('data-k');
      if (!k) return;
      S.form[k] = t.value;
      if (t.hasAttribute('data-clave-motivo') && S.clave) {
        S.clave.motivo = t.value;
        S.clave.errMotivo = false;
      }
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      var k = t.getAttribute && t.getAttribute('data-k');
      if (!k) return;
      S.form[k] = t.value;
      if (t.hasAttribute('data-re')) render();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (S.hoja) {
          e.preventDefault();
          cerrarHoja();
        } else if (S.panel) {
          e.preventDefault();
          ACC.panel();
        }
        return;
      }
      if (e.key === 'Tab' && S.hoja) {
        var h = $('.hoja');
        if (!h) return;
        var foc = $$(
          'button:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex="-1"]',
          h,
        ).filter(function (x) {
          return x.offsetParent !== null;
        });
        if (!foc.length) return;
        var primero = foc[0];
        var ultimo = foc[foc.length - 1];
        if (e.shiftKey && document.activeElement === primero) {
          e.preventDefault();
          ultimo.focus();
        } else if (!e.shiftKey && document.activeElement === ultimo) {
          e.preventDefault();
          primero.focus();
        } else if (!h.contains(document.activeElement)) {
          e.preventDefault();
          primero.focus();
        }
        return;
      }
      var t = e.target;
      var campoTexto =
        t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
      if (campoTexto || e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^[0-9]$/.test(e.key)) {
        if ((S.hoja && S.hoja.tipo === 'clave') || ruta() === 'pin-teclado') {
          e.preventDefault();
          teclaDigito(e.key);
        }
      } else if (e.key === 'Backspace') {
        if ((S.hoja && S.hoja.tipo === 'clave') || ruta() === 'pin-teclado') {
          e.preventDefault();
          teclaDigito('b');
        }
      }
    });
    document.addEventListener(
      'toggle',
      function (e) {
        var d = e.target;
        if (d && d.tagName === 'DETAILS' && d.hasAttribute('data-g'))
          ABIERTOS[d.getAttribute('data-g')] = d.open;
      },
      true,
    );
    window.addEventListener('hashchange', function () {
      if (!S.mantenerHoja) S.hoja = null;
      S.mantenerHoja = false;
      render({ cambio: true });
    });

    /* ---------- Inicio ---------- */
    function iniciar() {
      S = estadoNuevo();
      var t = leer('tema');
      if (t === 'claro' || t === 'oscuro' || t === 'auto') S.tema = t;
      var p = leer('pistas');
      if (p === '0') S.pistas = false;
      aplicarTema();
      $('#btn-panel').innerHTML = ico('panel', 20) + 'Presentación';
      setInterval(tick, 1000);
      var h = location.hash.replace(/^#/, '');
      if (h && RUTAS[h] && h !== 'portada') {
        var e = null;
        GRUPOS.forEach(function (g) {
          g.e.forEach(function (id) {
            if (!e && ESC[id].ruta === h) e = id;
          });
        });
        if (e) {
          saltarEscena(e);
          return;
        }
      }
      render({ cambio: true });
    }
    iniciar();
  })();
</script>
</body>
</html>
